[package]
name = "houseparty-card-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Leptos UI for the HouseParty card, compiled to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

# Keep this list short: every crate here runs inside the user's HA session.
# Cargo.lock pins exact versions; `cargo deny` and `cargo audit` gate CI.
[dependencies]
houseparty-core = { path = "../houseparty-core" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Element", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Window", "Crypto", "MediaQueryList", "HtmlMediaElement", "HtmlVideoElement", "Navigator"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
